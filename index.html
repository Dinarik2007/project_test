<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для статей</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      background: linear-gradient(165deg, #e8f0e4 0%, #f0ebe3 45%, #dce8d8 100%);
      color: #1a2e1a;
    }

    /* Фон с бабочками */
    .butterflies-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    @keyframes drift {
      0%   { transform: translate(0, 0) rotate(var(--rot, 0deg)) scale(1); }
      20%  { transform: translate(8vw, -6vh) rotate(calc(var(--rot, 0deg) + 12deg)) scale(1.05); }
      40%  { transform: translate(-4vw, -14vh) rotate(calc(var(--rot, 0deg) - 8deg)) scale(0.95); }
      60%  { transform: translate(10vw, -8vh) rotate(calc(var(--rot, 0deg) + 6deg)) scale(1.02); }
      80%  { transform: translate(-6vw, 4vh) rotate(calc(var(--rot, 0deg) - 10deg)) scale(1); }
      100% { transform: translate(0, 0) rotate(var(--rot, 0deg)) scale(1); }
    }

    .butterfly-wrap {
      position: absolute;
      animation: drift var(--dur, 18s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .butterfly-wrap .b-svg {
      display: block;
      width: clamp(48px, 8vw, 88px);
      height: auto;
      opacity: 0.78;
      filter: drop-shadow(0 2px 8px rgba(26, 46, 26, 0.1));
      transform-origin: center center;
      animation: wing-flap 0.28s ease-in-out infinite alternate;
    }

    @keyframes wing-flap {
      from { transform: perspective(80px) rotateY(-18deg); }
      to   { transform: perspective(80px) rotateY(18deg); }
    }

    .butterfly-wrap:nth-child(1) { top: 8%;  left: 5%;  --dur: 22s; --delay: 0s;    --rot: -5deg; }
    .butterfly-wrap:nth-child(2) { top: 18%; right: 8%; left: auto; --dur: 19s; --delay: -3s;   --rot: 8deg; }
    .butterfly-wrap:nth-child(3) { top: 42%; left: 3%;  --dur: 25s; --delay: -7s;   --rot: 3deg; }
    .butterfly-wrap:nth-child(4) { top: 55%; right: 4%; left: auto; --dur: 21s; --delay: -2s;   --rot: -12deg; }
    .butterfly-wrap:nth-child(5) { top: 72%; left: 12%; --dur: 24s; --delay: -11s;  --rot: 6deg; }
    .butterfly-wrap:nth-child(6) { top: 12%; left: 38%; --dur: 17s; --delay: -5s;   --rot: -8deg; }
    .butterfly-wrap:nth-child(7) { top: 65%; right: 18%; left: auto; --dur: 26s; --delay: -8s;  --rot: 4deg; }
    .butterfly-wrap:nth-child(8) { top: 35%; right: 28%; left: auto; --dur: 20s; --delay: -14s; --rot: -4deg; }

    main {
      position: relative;
      z-index: 1;
      max-width: 36rem;
      margin: 1rem;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(26, 46, 26, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.6);
      animation: card-in 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
      animation: title-shine 4s ease-in-out infinite;
    }

    @keyframes title-shine {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.88; }
    }

    ul {
      margin: 0;
      padding-left: 1.25rem;
    }

    li {
      margin-bottom: 0.75rem;
      line-height: 1.5;
      opacity: 0;
      animation: li-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    li:nth-child(1) { animation-delay: 0.35s; }
    li:nth-child(2) { animation-delay: 0.5s; }
    li:nth-child(3) { animation-delay: 0.65s; }

    @keyframes li-in {
      from {
        opacity: 0;
        transform: translateX(-12px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    li:last-child { margin-bottom: 0; }
  </style>
</head>
