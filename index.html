<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для статей</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f3;
      color: #1a2e1a;
    }
    main {
      max-width: 36rem;
      padding: 2rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(26, 46, 26, 0.08);
    }
    h1 {
      margin: 0 0 1.5rem;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
    }
    ul {
      margin: 0;
      padding-left: 1.25rem;
    }
    li {
      margin-bottom: 0.75rem;
      line-height: 1.5;
    }
    li:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Генератор идей для статей</h1>
    <ul>
      <li>5 идей для статей от экспертов в области сада и огорода</li>
      <li>3 идеи сторис на сегодня</li>
      <li>Контент-план на неделю для dzen</li>
    </ul>
  </main>
</body>
</html>
